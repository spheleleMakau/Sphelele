<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sphelele Owner Portal</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { margin: 0; font-family: 'DM Sans', sans-serif; background: #f9f6f4; color: #201d1d; }
    .owner-shell { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }
    .owner-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .owner-header h1 { font: 600 42px/1 'Playfair Display', serif; margin: 0; letter-spacing: -0.05em; }
    .owner-link { text-decoration: none; color: #201d1d; border: 1px solid #d8c8c1; padding: 12px 16px; background: white; }
    .owner-grid { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 24px; }
    .card { background: white; border: 1px solid #eee0dc; border-radius: 18px; padding: 24px; box-shadow: 0 10px 30px rgba(34, 24, 22, 0.03); }
    .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
    .day { min-height: 110px; border: 1px solid #f0e3df; border-radius: 12px; padding: 10px; background: #fffaf8; }
    .day h3 { margin: 0 0 8px; font-size: 13px; color: #6c5a57; }
    .slot { display: block; font-size: 11px; padding: 6px 8px; background: #f9eae5; color: #663d38; border-radius: 8px; margin-top: 6px; }
    .side-list { display: flex; flex-direction: column; gap: 14px; }
    .mini-item { border: 1px solid #f0e3df; padding: 14px; border-radius: 12px; background: #fff; }
    .tag { display: inline-block; background: #f7d9d4; color: #5f2c2a; padding: 4px 8px; border-radius: 999px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; }
    .empty { color: #726562; font-size: 13px; }
    @media (max-width: 800px) { .owner-grid { grid-template-columns: 1fr; } .calendar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <div class="owner-shell">
    <header class="owner-header">
      <div>
        <p class="eyebrow">Owner portal</p>
        <h1>Sphelele calendar</h1>
      </div>
      <a class="owner-link" href="/">Public booking page</a>
    </header>

    <div class="owner-grid">
      <section class="card">
        <div id="calendar" class="calendar"></div>
      </section>

      <aside class="side-list">
        <div class="card mini-item">
          <span class="tag">Overview</span>
          <h3 id="totalBookings">0 bookings</h3>
        </div>
        <div class="card mini-item">
          <span class="tag">This week</span>
          <div id="weekSummary" class="empty">No bookings yet.</div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    async function fetchAppointments() {
      const localBooking = JSON.parse(localStorage.getItem('spheleleConfirmedBooking') || 'null');
      const localAppointments = localBooking && localBooking.name ? [{
        client: localBooking.name,
        whatsapp: localBooking.whatsapp,
        service: localBooking.service,
        date: localBooking.date,
        start_time: localBooking.timeLabel,
        status: 'CONFIRMED',
        deposit_paid: true,
      }] : [];

      try {
        const response = await fetch('/api/appointments/');
        if (!response.ok) return localAppointments;
        const data = await response.json();
        const appointments = Array.isArray(data.appointments) ? data.appointments : [];
        return appointments.length ? appointments : localAppointments;
      } catch (error) {
        return localAppointments;
      }
    }

    function formatDateKey(dateText) {
      const dt = new Date(dateText + 'T00:00:00');
      return dt.toISOString().slice(0, 10);
    }

    function buildCalendar(bookings) {
      const container = document.getElementById('calendar');
      const today = new Date();
      const start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 7);
      const days = Array.from({ length: 14 }, (_, index) => {
        const date = new Date(start);
        date.setDate(start.getDate() + index);
        return date;
      });

      const grouped = {};
      bookings.forEach(item => {
        const key = formatDateKey(item.date);
        grouped[key] = grouped[key] || [];
        grouped[key].push(item);
      });

      container.innerHTML = days.map(date => {
        const key = date.toISOString().slice(0, 10);
        const items = grouped[key] || [];
        return `
          <div class="day">
            <h3>${date.toLocaleDateString('en-ZA', { weekday: 'short', day: 'numeric' })}</h3>
            ${items.length ? items.map(item => `<span class="slot">${item.start_time} · ${item.client}</span>`).join('') : '<span class="empty">Open</span>'}
          </div>
        `;
      }).join('');

      document.getElementById('totalBookings').textContent = `${bookings.length} booking${bookings.length === 1 ? '' : 's'}`;
      document.getElementById('weekSummary').innerHTML = bookings.length ? bookings.slice(0, 4).map(item => `<div class="slot">${item.date} · ${item.start_time} · ${item.client}</div>`).join('') : 'No bookings yet.';
    }

    fetchAppointments().then(buildCalendar);
  </script>
</body>
</html>
